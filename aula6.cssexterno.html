<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de classes e css interno</title>
    <style>
        .titulo{
            color: blue;
            text-align: center;
        }
        .caixa01{
            background-color: aliceblue;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
            
        }
        .caixa02{
            background-color: rgb(29, 109, 179);
            border: 2px solid rgb(150, 150, 179);
            padding: 20px;
            margin: 20px;
        } 
        
        .destaque01{

          color: black;
          font-weight: bold;

}
         .destaque02{
          color: rgb(87, 64, 141);
          background-color: rgb(222, 215, 250);
          font-style: italic;
          padding: 10px; 
         }  





    </style>
</head>
<body>
    <h1 class="Titulo">aprendendo classe em css</h1>
    <div class="caixa01">
        <p>
            estou aprendendo a utilizar classe para personaliza
            os elementos da pagina.
        </p>
        <br>
        <p class ="destaque01">
            este paragrafo utiliza a classe destaque01
        </p>
        <p class ="destaque02">
            este paragrafo utiliza a classe destaque02
        </p>
    </div>
    <div class="caixa02">
        <p>este paragrafo não utiliza nenhum classe</p>
    </div>
</body>
</html>
